packages:
  - 'apps/*'
  - 'packages/*'

# Native postinstall scripts not needed for dev/CI (file watcher, eslint resolver binary).
ignoredBuiltDependencies:
  - '@parcel/watcher'
  - unrs-resolver

# Postinstall scripts that must run: embedded Postgres binaries (symlinks on Linux) and Prisma engines.
onlyBuiltDependencies:
  - '@embedded-postgres/linux-x64'
  - '@embedded-postgres/windows-x64'
  - '@prisma/engines'
  - prisma
